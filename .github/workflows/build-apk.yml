
name: Build PROJECT AWAKENING APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'PROJECT_AWAKENING_ANDROID_SOURCE_PACKAGE.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unpack Android source package
        run: |
          mkdir package
          unzip -q PROJECT_AWAKENING_ANDROID_SOURCE_PACKAGE.zip -d package
          mkdir android-project
          unzip -q package/project-awakening-source.zip -d android-project

      - name: Build debug APK
        working-directory: android-project
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PROJECT-AWAKENING-debug-apk
          path: android-project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
